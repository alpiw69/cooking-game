<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugar Rush Café — warm scoops, boba &amp; cake, made to order</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7e8c8; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #f7e8c8; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Sugar Rush Café: a warm dessert café game. Walk the chef, take orders, scoop ice cream, bake and blend, garnish at the finishing counter, and serve before customers run out of patience."></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
