<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kerajaan — masak untuk raja</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10162c; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #141b33; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Dapur Kerajaan: game masak di dapur istana. Terima pesanan, masak di wok, arang dan pot teh, dan sajikan sebelum tamu kehabisan sabar."></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
